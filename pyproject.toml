[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "falso"
version = "0.1.0"
description = "Falso — production-grade AI assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "psutil>=7.0.0",
    "openai>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
voice = [
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
]
memory = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]
vision = [
    "pillow>=10.0.0",
    "pytesseract>=0.3.0",
]

[tool.hatch.build.targets.wheel]
# Hatchling auto-detection only matches packages named after the project
# (falso/); `app` and `config` must be declared explicitly.
packages = ["app", "config"]
# FRONTEND_ROOT in app/main.py resolves relative to the installed package,
# so the frontend must ship inside the wheel (used by the Docker image).
force-include = { "frontend" = "frontend" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
