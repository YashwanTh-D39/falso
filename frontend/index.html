<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Falso — AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080e;
  --bg2:#0d0d1a;
  --surface:#12121f;
  --surface2:#1a1a2e;
  --border:#1e1e3a;
  --text:#e0e0f0;
  --text2:#9090b0;
  --accent:#00e5ff;
  --accent2:#7c4dff;
  --accent3:#ff4081;
  --glow:0 0 20px rgba(0,229,255,.15),0 0 60px rgba(0,229,255,.05);
  --radius:12px;
  --radius-sm:8px;
  --sidebar-w:280px;
}
html,body{height:100%}
body{
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% -20%,rgba(124,77,255,.08),transparent),
             radial-gradient(ellipse 60% 50% at 80% 100%,rgba(0,229,255,.06),transparent);
  pointer-events:none;
  z-index:0;
}

/* Layout */
.layout{
  position:relative;
  z-index:1;
  display:flex;
  width:100%;
  max-width:1040px;
  height:100vh;
  max-height:900px;
  margin:16px;
}
@media(max-width:768px){
  .layout{max-height:none;height:100vh;margin:0}
}

/* Sidebar */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg2);
  border:1px solid var(--border);
  border-right:none;
  border-radius:var(--radius) 0 0 var(--radius);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
@media(max-width:768px){
  .sidebar{
    position:fixed;
    top:0;left:0;bottom:0;z-index:200;
    border:1px solid var(--border);
    border-radius:0 var(--radius) var(--radius) 0;
    transform:translateX(-110%);
    transition:transform .3s cubic-bezier(.22,.68,0,1);
    box-shadow:4px 0 30px rgba(0,0,0,.5);
  }
  .sidebar.open{transform:translateX(0)}
}

.sidebar-header{
  display:flex;
  align-items:center;
  padding:14px 14px;
  border-bottom:1px solid var(--border);
  gap:10px;
  flex-shrink:0;
}
.sidebar-logo{
  font-size:16px;font-weight:700;
  color:var(--accent2);
  white-space:nowrap;
}
.new-chat-btn{
  flex:1;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 12px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--surface);
  color:var(--text);
  font-size:13px;font-weight:500;cursor:pointer;
  font-family:inherit;
  transition:background .2s,border-color .2s,box-shadow .2s;
}
.new-chat-btn:hover{
  background:var(--surface2);
  border-color:var(--accent2);
  box-shadow:0 0 12px rgba(124,77,255,.15);
}
.new-chat-btn svg{width:16px;height:16px;fill:currentColor}

.conversations{
  flex:1;overflow-y:auto;padding:8px;
}
.conversations::-webkit-scrollbar{width:4px}
.conversations::-webkit-scrollbar-track{background:transparent}
.conversations::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

.conv-item{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:background .2s;
  position:relative;
  group:true;
}
.conv-item:hover{background:var(--surface)}
.conv-item.active{background:var(--surface2);border-left:2px solid var(--accent2)}
.conv-item .conv-icon{
  width:28px;height:28px;flex-shrink:0;
  border-radius:6px;
  background:linear-gradient(135deg,var(--accent2),#651fff);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#000;font-weight:700;
}
.conv-item .conv-info{flex:1;min-width:0}
.conv-item .conv-title{
  font-size:13px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.conv-item .conv-date{
  font-size:11px;color:var(--text2);margin-top:2px;
}
.conv-item .conv-del{
  width:24px;height:24px;flex-shrink:0;
  border:none;background:transparent;
  color:var(--text2);cursor:pointer;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s,background .2s,color .2s;
  font-size:14px;
}
.conv-item:hover .conv-del{opacity:.6}
.conv-item .conv-del:hover{opacity:1;background:var(--border);color:var(--accent3)}

/* Overlay (mobile) */
.overlay{
  display:none;
  position:fixed;
  inset:0;z-index:150;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(2px);
}
.overlay.show{display:block}

/* App (chat panel) */
.app{
  flex:1;min-width:0;
  display:flex;flex-direction:column;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:0 var(--radius) var(--radius) 0;
}
@media(max-width:768px){
  .app{border-radius:0;border:none}
}

/* Header */
.header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
  flex-shrink:0;
}
.menu-btn{
  display:none;
  width:36px;height:36px;flex-shrink:0;
  border:none;border-radius:var(--radius-sm);
  background:var(--surface);
  color:var(--text);
  font-size:18px;cursor:pointer;
  align-items:center;justify-content:center;
  transition:background .2s;
}
.menu-btn:hover{background:var(--surface2)}
@media(max-width:768px){.menu-btn{display:flex}}
.header-logo{
  width:36px;height:36px;
  border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;color:#000;
  flex-shrink:0;
}
.header-info{flex:1;min-width:0}
.header-title{
  font-size:15px;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.header-status{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:500;color:var(--text2);
}
.header-status::before{
  content:'';width:6px;height:6px;
  border-radius:50%;background:#00c853;
  box-shadow:0 0 8px rgba(0,200,83,.5);
  animation:pulse-dot 2s infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
.header-model{
  font-size:11px;color:var(--text2);
  background:var(--surface2);padding:3px 10px;
  border-radius:20px;font-family:'JetBrains Mono',monospace;
  flex-shrink:0;
}

/* Messages */
.messages{
  flex:1;overflow-y:auto;padding:20px 24px;
  display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.welcome{
  text-align:center;margin:auto auto 40px;max-width:380px;
}
.welcome-icon{
  width:56px;height:56px;margin:0 auto 16px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:26px;box-shadow:0 0 30px rgba(0,229,255,.2);
}
.welcome h2{font-size:18px;font-weight:600;margin-bottom:6px}
.welcome p{font-size:13px;color:var(--text2);line-height:1.6}

/* Bubbles */
.bubble{
  max-width:82%;padding:12px 16px;
  border-radius:16px;line-height:1.55;
  font-size:14px;position:relative;
  animation:bubble-in .3s cubic-bezier(.22,.68,0,1);
  word-wrap:break-word;overflow-wrap:break-word;
  white-space:pre-wrap;
}
@keyframes bubble-in{
  0%{opacity:0;transform:translateY(12px) scale(.96)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.bubble.user{
  align-self:flex-end;
  background:linear-gradient(135deg,var(--accent2),#651fff);
  color:#fff;border-bottom-right-radius:4px;
}
.bubble.falso{
  align-self:flex-start;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);border-bottom-left-radius:4px;
}
.bubble .time{
  display:block;font-size:10px;color:inherit;opacity:.5;
  margin-top:6px;text-align:right;font-weight:500;
}
.bubble.falso .time{text-align:left}

/* Typing indicator */
.typing{
  align-self:flex-start;
  display:flex;align-items:center;gap:4px;
  padding:14px 20px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:16px;border-bottom-left-radius:4px;
  animation:bubble-in .25s ease;
}
.typing span{
  width:7px;height:7px;border-radius:50%;
  background:var(--accent2);
  animation:typing-bounce 1.4s infinite;
}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typing-bounce{
  0%,60%,100%{transform:translateY(0);opacity:.3}
  30%{transform:translateY(-8px);opacity:1}
}
.typing-label{
  font-size:12px;color:var(--text2);margin-left:8px;
}

/* Input area */
.input-area{
  display:flex;gap:10px;padding:16px 24px 20px;
  border-top:1px solid var(--border);background:var(--bg2);
  flex-shrink:0;
}
textarea{
  flex:1;resize:none;padding:12px 16px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);
  font-family:Inter,sans-serif;font-size:14px;line-height:1.5;
  outline:none;transition:border-color .2s,box-shadow .2s;
  min-height:48px;max-height:160px;
}
textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(124,77,255,.15)}
textarea::placeholder{color:var(--text2)}
textarea:disabled{opacity:.5;cursor:not-allowed}
.send-btn{
  width:48px;height:48px;flex-shrink:0;
  border:none;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--accent2),#651fff);
  color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .2s,transform .15s,box-shadow .2s;
  align-self:flex-end;
}
.send-btn:hover:not(:disabled){opacity:.9;box-shadow:0 0 20px rgba(124,77,255,.3)}
.send-btn:active:not(:disabled){transform:scale(.95)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.send-btn svg{width:20px;height:20px;fill:currentColor}

/* Toast */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  background:#ff1744;color:#fff;padding:10px 20px;
  border-radius:var(--radius-sm);font-size:13px;font-weight:500;
  box-shadow:0 4px 20px rgba(255,23,68,.3);
  opacity:0;transition:opacity .3s,transform .3s;
  pointer-events:none;z-index:300;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">✦ Falso</span>
      <button class="new-chat-btn" id="newChatBtn" title="New conversation">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        New Chat
      </button>
    </div>
    <div class="conversations" id="conversationList"></div>
  </aside>

  <div class="app">
    <div class="header">
      <button class="menu-btn" id="menuBtn" aria-label="Toggle sidebar">☰</button>
      <div class="header-logo">F</div>
      <div class="header-info">
        <div class="header-title">Falso</div>
        <div class="header-status">Online</div>
      </div>
      <div class="header-model" id="modelBadge">deepseek</div>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✦</div>
        <h2>Ask me anything</h2>
        <p>I'm Falso, your AI assistant. Send a message to get started.</p>
      </div>
    </div>

    <div class="input-area">
      <textarea id="input" rows="1" placeholder="Type a message..."></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>

<script>
const API_BASE = '/api/v1';
const CONV_API = API_BASE + '/conversations';
const ACTIVE_KEY = 'falso_active_id';

// --- DOM refs ---
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const modelBadge = document.getElementById('modelBadge');
const welcomeEl = document.getElementById('welcome');
const toastEl = document.getElementById('toast');
const sidebarEl = document.getElementById('sidebar');
const menuBtn = document.getElementById('menuBtn');
const overlayEl = document.getElementById('overlay');
const newChatBtn = document.getElementById('newChatBtn');
const convListEl = document.getElementById('conversationList');

// --- State ---
let isLoading = false;
let conversations = [];
let activeId = null;
let currentMessages = [];

function uid(){return crypto.randomUUID?.()||(Date.now().toString(36)+Math.random().toString(36).slice(2,8))}

// --- API helpers ---
async function apiGet(path){const r=await fetch(path);if(!r.ok)throw new Error(await r.text());return r.json()}
async function apiPost(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
async function apiDel(path){const r=await fetch(path,{method:'DELETE'});if(!r.ok)throw new Error(await r.text());return r.json()}

// --- API: conversations ---
async function fetchConvList(){return apiGet(CONV_API+'/')}
async function fetchConv(id){return apiGet(CONV_API+'/'+encodeURIComponent(id))}
async function saveConv(conv){return apiPost(CONV_API+'/',conv)}
async function deleteConvFile(id){return apiDel(CONV_API+'/'+encodeURIComponent(id))}

function loadActiveId(){return localStorage.getItem(ACTIVE_KEY)||null}
function saveActiveId(id){if(id)localStorage.setItem(ACTIVE_KEY,id);else localStorage.removeItem(ACTIVE_KEY)}

function getConv(id){return conversations.find(c=>c.id===id)}
function getActiveConv(){return getConv(activeId)}

function genTitle(msgs){
  const first=msgs.find(m=>m.role==='user');
  if(!first)return 'New Chat';
  let t=first.text.trim();
  if(t.length>35)t=t.slice(0,35)+'…';
  return t;
}

// --- Render sidebar ---
function renderSidebar(){
  let html='';
  if(!conversations.length){
    html='<div style="text-align:center;padding:30px 16px;color:var(--text2);font-size:13px">No conversations yet</div>';
  }else{
    for(const c of conversations){
      const active=c.id===activeId?' active':'';
      const dateStr=c.updatedAt?new Date(c.updatedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
      html+=`
        <div class="conv-item${active}" data-id="${c.id}">
          <div class="conv-icon">${(c.title||'N').charAt(0).toUpperCase()}</div>
          <div class="conv-info">
            <div class="conv-title">${escHtml(c.title||'New Chat')}</div>
            <div class="conv-date">${dateStr}</div>
          </div>
          <button class="conv-del" data-del="${c.id}" title="Delete">&times;</button>
        </div>`;
    }
  }
  convListEl.innerHTML=html;
  convListEl.querySelectorAll('.conv-item').forEach(el=>{
    el.addEventListener('click',e=>{if(e.target.closest('.conv-del'))return;switchConv(el.dataset.id);closeSidebar()});
  });
  convListEl.querySelectorAll('.conv-del').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();delConv(el.dataset.del)});
  });
}

function escHtml(s){
  const d=document.createElement('div');
  d.textContent=s;
  return d.innerHTML;
}

// --- Switch conversation ---
async function switchConv(id){
  try{
    const data=await fetchConv(id);
    const messages=data.messages||[];
    // update in-memory list
    const idx=conversations.findIndex(c=>c.id===id);
    if(idx>=0)conversations[idx]=data;
    else conversations.unshift(data);
    activeId=id;
    saveActiveId(id);
    renderMessages(messages);
    renderSidebar();
  }catch(e){
    showToast('Failed to load conversation');
  }
}

// --- New conversation ---
async function newConversation(){
  const conv={
    id:uid(),
    title:'New Chat',
    messages:[],
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString(),
  };
  try{
    await saveConv(conv);
    conversations.unshift(conv);
    activeId=conv.id;
    saveActiveId(conv.id);
    renderMessages([]);
    renderSidebar();
    closeSidebar();
    inputEl.focus();
  }catch(e){
    showToast('Failed to create conversation');
  }
}

// --- Delete conversation ---
async function delConv(id){
  const conv=getConv(id);
  if(!conv)return;
  if(conv.messages&&conv.messages.length&&!confirm('Delete "'+conv.title+'"?'))return;
  try{
    await deleteConvFile(id);
    conversations=conversations.filter(c=>c.id!==id);
    if(activeId===id){
      activeId=null;
      saveActiveId(null);
      conversations.length?switchConv(conversations[0].id):newConversation();
    }else{
      renderSidebar();
    }
  }catch(e){
    showToast('Failed to delete conversation');
  }
}

// --- Sidebar toggle (mobile) ---
function openSidebar(){sidebarEl.classList.add('open');overlayEl.classList.add('show')}
function closeSidebar(){sidebarEl.classList.remove('open');overlayEl.classList.remove('show')}

// --- Auto-resize textarea ---
function autoResize(){
  inputEl.style.height='auto';
  inputEl.style.height=Math.min(inputEl.scrollHeight,160)+'px';
}

function scrollToBottom(){
  messagesEl.scrollTop=messagesEl.scrollHeight;
}

function showToast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._hide);
  toastEl._hide=setTimeout(()=>toastEl.classList.remove('show'),3000);
}

function formatTime(date){
  return date.getHours().toString().padStart(2,'0')+':'+date.getMinutes().toString().padStart(2,'0');
}

function formatTimeISO(iso){
  return formatTime(new Date(iso));
}

// --- Render messages ---
function renderMessages(msgs){
  currentMessages=msgs?[...msgs]:[];
  messagesEl.innerHTML='';
  if(!currentMessages.length){
    welcomeEl.style.display='';
    messagesEl.appendChild(welcomeEl);
    return;
  }
  welcomeEl.style.display='none';
  for(const m of currentMessages){
    const b=document.createElement('div');
    b.className='bubble '+m.role;
    b.textContent=m.text;
    const t=document.createElement('span');
    t.className='time';
    t.textContent=formatTimeISO(m.time);
    b.appendChild(t);
    messagesEl.appendChild(b);
  }
  scrollToBottom();
}

function showTyping(){
  const el=document.createElement('div');
  el.className='typing';
  el.id='typingIndicator';
  el.innerHTML='<span></span><span></span><span></span><span class="typing-label">Falso is thinking...</span>';
  messagesEl.appendChild(el);
  scrollToBottom();
}

function hideTyping(){
  const el=document.getElementById('typingIndicator');
  if(el)el.remove();
}

function setLoading(loading){
  isLoading=loading;
  inputEl.disabled=loading;
  sendBtn.disabled=loading;
  inputEl.placeholder=loading?'Waiting for response...':'Type a message...';
  if(!loading)inputEl.focus();
}

function addBubble(text,role,time){
  welcomeEl.style.display='none';
  const b=document.createElement('div');
  b.className='bubble '+role;
  b.textContent=text;
  const t=document.createElement('span');
  t.className='time';
  t.textContent=formatTimeISO(time);
  b.appendChild(t);
  messagesEl.appendChild(b);
  scrollToBottom();
}

async function appendMessage(role,text,time){
  const msg={role,text,time:time||new Date().toISOString()};
  currentMessages.push(msg);
  addBubble(text,role,msg.time);
  const conv=getActiveConv();
  if(!conv)return;
  conv.messages=currentMessages;
  conv.updatedAt=new Date().toISOString();
  if(conv.title==='New Chat'){
    const first=currentMessages.find(m=>m.role==='user');
    if(first)conv.title=genTitle(currentMessages);
  }
  try{
    await saveConv(conv);
    // refresh in-memory list item
    const idx=conversations.findIndex(c=>c.id===conv.id);
    if(idx>=0)conversations[idx]=conv;
    renderSidebar();
  }catch(e){
    showToast('Failed to save message');
  }
}

// --- Send (streaming) ---
async function sendMessage(){
  const text=inputEl.value.trim();
  if(!text||isLoading)return;
  inputEl.value='';
  autoResize();

  await appendMessage('user',text);
  showTyping();
  setLoading(true);

  try{
    const res=await fetch(API_BASE+'/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:text}),
    });
    hideTyping();

    if(!res.ok){
      const err=await res.json().catch(()=>({detail:'Request failed'}));
      await appendMessage('falso','Error: '+(err.detail||'Something went wrong'));
      return;
    }

    // Streaming bubble
    const bubble=document.createElement('div');
    bubble.className='bubble falso';
    messagesEl.appendChild(bubble);
    scrollToBottom();

    let fullText='',model='',hasError=false;
    const reader=res.body.getReader();
    const decoder=new TextDecoder();
    let buffer='';

    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const lines=buffer.split('\n');
      buffer=lines.pop()||'';

      for(const line of lines){
        if(!line.trim())continue;
        try{
          const data=JSON.parse(line);
          if(data.error){fullText+='Error: '+data.error;hasError=true;continue}
          fullText+=data.response||'';
          if(data.done)model=data.model||model;
        }catch(_){}
      }

      bubble.textContent=fullText;
      if(!bubble.querySelector('.time')){
        const t=document.createElement('span');t.className='time';
        bubble.appendChild(t);
      }
      scrollToBottom();
    }

    const t=bubble.querySelector('.time');
    if(t)t.textContent=formatTime(new Date());
    if(model)modelBadge.textContent=model;

    if(!hasError){
      const msgTime=new Date().toISOString();
      currentMessages.push({role:'falso',text:fullText,time:msgTime});
      const conv=getActiveConv();
      if(conv){
        conv.messages=currentMessages;
        conv.updatedAt=msgTime;
        await saveConv(conv);
        const idx=conversations.findIndex(c=>c.id===conv.id);
        if(idx>=0)conversations[idx]=conv;
        renderSidebar();
      }
    }
  }catch(e){
    hideTyping();
    showToast('Connection error — is the server running?');
    await appendMessage('falso','Sorry, I encountered a network error.');
  }finally{
    setLoading(false);
  }
}

// --- Init ---
async function init(){
  try{
    conversations=await fetchConvList();
  }catch(e){
    conversations=[];
    showToast('Could not load conversations from server');
  }
  const savedId=loadActiveId();
  const conv=savedId?getConv(savedId):null;
  if(conv){
    try{
      const full=await fetchConv(conv.id);
      activeId=full.id;
      renderMessages(full.messages||[]);
    }catch(e){
      activeId=null;
    }
  }
  if(!conversations.length){
    await newConversation();
  }else if(!activeId){
    await switchConv(conversations[0].id);
  }else{
    renderSidebar();
  }
}

// --- Events ---
inputEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}
});
sendBtn.addEventListener('click',sendMessage);
inputEl.addEventListener('input',autoResize);

menuBtn.addEventListener('click',openSidebar);
overlayEl.addEventListener('click',closeSidebar);
newChatBtn.addEventListener('click',newConversation);

// --- Start ---
init();
</script>
