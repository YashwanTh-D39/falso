<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.A.L.S.O. // AI CORE ONLINE</title>
    <style>
        :root {
            --color-primary: #00BFFF;
            --color-primary-dim: #4DA6FF;
            --color-accent: #00E5FF;
            --color-highlight: #7DF9FF;
            --color-glow: #00E5FF;
            --color-bg: #020B1F;
            --color-bg-secondary: #06142E;
            --color-glass: rgba(20, 40, 80, 0.45);
            --color-glass-border: rgba(120, 220, 255, 0.20);
            --color-text: #F2FAFF;
            --color-text-dim: #B6D7F5;
            --font-mono: "Courier New", Courier, monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-mono);
            overflow: hidden;
            user-select: none;
        }

        /* 3D Orb Background */
        #orb-root {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Overlays */
        .overlay-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .overlay-scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 11;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.2) 50%,
                rgba(0, 0, 0, 0.2)
            );
            background-size: 100% 4px;
        }

        .overlay-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 12;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.9) 100%);
        }

        /* UI Containers */
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-panel {
            pointer-events: auto;
            background: var(--color-glass);
            border: 1px solid var(--color-glass-border);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.15);
            padding: 15px;
            backdrop-filter: blur(8px);
        }

        /* Header */
        #header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--color-glow);
            margin: 0;
        }

        .status {
            font-size: 14px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Diagnostics */
        #diagnostics {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 250px;
            font-size: 12px;
        }

        /* Chat Area */
        #chat-area {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 800px;
            max-height: 40vh;
            overflow-y: auto;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }

        .message {
            background: rgba(0, 191, 255, 0.08);
            border-left: 3px solid var(--color-primary);
            padding: 10px;
            font-size: 14px;
            line-height: 1.4;
            text-shadow: 0 0 2px rgba(0, 229, 255, 0.3);
            color: var(--color-text);
        }

        .message.user {
            border-left: none;
            border-right: 3px solid var(--color-highlight);
            background: rgba(125, 249, 255, 0.08);
            align-self: flex-end;
            text-align: right;
            color: var(--color-highlight);
        }

        #tool-indicator {
            display: none;
            font-size: 12px;
            color: var(--color-accent);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Input Bar */
        #command-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 800px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(2, 11, 31, 0.85);
            border: 1px solid var(--color-primary);
            color: var(--color-text);
            font-family: var(--font-mono);
            font-size: 16px;
            padding: 10px 15px;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0, 191, 255, 0.15);
        }

        input[type="text"]:focus {
            box-shadow: inset 0 0 15px rgba(0, 191, 255, 0.35), 0 0 10px rgba(0, 229, 255, 0.4);
        }

        button {
            background: rgba(0, 191, 255, 0.15);
            border: 1px solid var(--color-primary);
            color: var(--color-primary);
            font-family: var(--font-mono);
            font-size: 14px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background: var(--color-primary);
            color: var(--color-bg);
            box-shadow: 0 0 15px var(--color-glow);
        }

        button.active {
            background: var(--color-accent);
            color: var(--color-bg);
            box-shadow: 0 0 20px var(--color-glow);
        }

        /* Side Panels */
        .side-panel {
            position: absolute;
            top: 100px;
            bottom: 100px;
            width: 300px;
            background: rgba(6, 20, 46, 0.92);
            border: 1px solid var(--color-glass-border);
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            pointer-events: auto;
            backdrop-filter: blur(12px);
        }

        #settings-panel {
            right: 20px;
            border-right: none;
        }

        #archive-panel {
            left: 20px;
            border-left: none;
        }

        .panel-header {
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid var(--color-glass-border);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--color-text-dim);
        }

        select, input[type="password"] {
            background: rgba(2, 11, 31, 0.8);
            border: 1px solid var(--color-glass-border);
            color: var(--color-text);
            font-family: var(--font-mono);
            padding: 5px;
        }

        /* HUD Hints & Controls */
        #hud-hints {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 10px;
            color: var(--color-text-dim);
        }

        #hud-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        /* Startup Animation */
        #startup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-in-out;
        }

        #startup-log {
            font-size: 14px;
            margin-top: 20px;
            min-height: 20px;
        }

        .progress-bar-container {
            width: 300px;
            height: 2px;
            background: rgba(0, 191, 255, 0.15);
            margin-top: 20px;
        }

        .progress-bar {
            height: 100%;
            background: var(--color-primary);
            width: 0%;
            transition: width 0.2s;
            box-shadow: 0 0 10px var(--color-glow);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-primary-dim);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-primary);
        }
    </style>
    
    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="orb-root"></div>
    <div class="overlay-grain"></div>
    <div class="overlay-scanlines"></div>
    <div class="overlay-vignette"></div>

    <div id="startup-overlay">
        <h1 class="title" style="font-size: 48px;">F.A.L.S.O.</h1>
        <div id="startup-log">INITIALIZING...</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="startup-progress"></div>
        </div>
    </div>

    <div id="ui-layer">
        <div id="header">
            <div>
                <h1 class="title">F.A.L.S.O.</h1>
                <div class="status">SYSTEM READY // AI CORE ONLINE</div>
            </div>
            <div class="sysid">FALSO // AI CORE ONLINE</div>
        </div>

        <div id="diagnostics" class="hud-panel">
            <div class="panel-header">DIAGNOSTICS</div>
            <div id="diag-content">
                SYS.MEM: 1024 MB<br>
                LATENCY: 42 ms<br>
                UPTIME: 00:00:00<br>
                STATE: IDLE
            </div>
        </div>

        <div id="archive-panel" class="side-panel">
            <div class="panel-header">ARCHIVE</div>
            <div id="conv-list"></div>
            <button onclick="newConversation()">NEW CONVERSATION</button>
        </div>

        <div id="settings-panel" class="side-panel">
            <div class="panel-header">SETTINGS</div>
            <div class="form-group">
                <label>AI PROVIDER</label>
                <select id="set-provider">
                    <option value="gemini">Gemini</option>
                    <option value="openai">OpenAI</option>
                </select>
            </div>
            <div class="form-group">
                <label>API KEY</label>
                <input type="password" id="set-key">
            </div>
            <div class="form-group">
                <label>MODEL</label>
                <select id="set-model">
                    <option value="gemini-3.6-flash">gemini-3.6-flash (Default)</option>
                    <option value="gemini-3.1-flash">gemini-3.1-flash</option>
                    <option value="gemini-3.1-pro">gemini-3.1-pro</option>
                    <option value="gemini-1.5-flash">gemini-1.5-flash</option>
                    <option value="gemini-1.5-pro">gemini-1.5-pro</option>
                </select>
            </div>
            <div class="form-group">
                <label>TTS PROVIDER</label>
                <select id="set-tts-provider">
                    <option value="elevenlabs">ElevenLabs (Cloud)</option>
                    <option value="edge">Edge Neural TTS</option>
                    <option value="local">Local TTS (pyttsx3)</option>
                </select>
            </div>
            <div class="form-group">
                <label>ELEVENLABS API KEY</label>
                <input type="password" id="set-el-key" placeholder="Paste ElevenLabs key...">
            </div>
            <div class="form-group">
                <label>ELEVENLABS VOICE</label>
                <select id="set-el-voice">
                    <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Default)</option>
                </select>
            </div>
            <button onclick="saveSettings()">SAVE CONFIG</button>
            <button onclick="testConnection()">TEST CONN</button>
            <button onclick="testVoice()">TEST VOICE</button>
        </div>

        <div id="chat-area">
            <!-- Messages will appear here -->
        </div>

        <div id="toolIndicator" style="display:none;font-size:11px;color:#7DF9FF;text-align:center;margin-bottom:6px"></div>

        <div id="command-bar" class="hud-panel">
            <button id="btn-mic">MIC [OFF]</button>
            <input type="text" id="cmd-input" placeholder="Enter command or query..." autocomplete="off">
            <button id="btn-send">SEND</button>
        </div>

        <div id="hud-hints">
            [CMD+S] Settings | [CMD+A] Archive | [ESC] Reset View
        </div>

        <div id="hud-controls">
            <button onclick="togglePanel('archive-panel')">ARCHIVE</button>
            <button onclick="togglePanel('settings-panel')">SETTINGS</button>
            <button id="btn-reset-cam">RESET CAM</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // ==========================================
        // FALSO BACKEND INTEGRATION
        // ==========================================
        const API_BASE = '/api/v1';
        const CONV_API = API_BASE + '/conversations';
        const ACTIVE_KEY = 'falso_active_conv';

        function escHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        let currentConvId = null;
        let micActive = false;
        let speechRec = null;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let isSpeaking = false;
        let sysState = 'idle'; // idle, thinking, listening, speaking, error

        async function apiGet(path) {
            try {
                const res = await fetch(path);
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                return await res.json();
            } catch (e) {
                console.error("API GET Error:", e);
                return null;
            }
        }

        async function apiPost(path, body) {
            try {
                const res = await fetch(path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                return await res.json();
            } catch (e) {
                console.error("API POST Error:", e);
                return null;
            }
        }

        // Conversations
        async function fetchConvList() {
            const list = await apiGet(CONV_API + '/');
            if (list) populateArchive(list);
        }

        async function fetchConv(id) {
            const conv = await apiGet(`${CONV_API}/${id}`);
            if (conv) {
                currentConvId = id;
                document.getElementById('chat-area').innerHTML = '';
                conv.messages.forEach(m => appendMessage(m.role, m.content));
            }
        }

        async function saveConv(conv) {
            await apiPost(CONV_API + '/', conv);
            fetchConvList();
        }

        window.newConversation = () => {
            currentConvId = null;
            document.getElementById('chat-area').innerHTML = '';
            appendMessage('system', 'New session initialized.');
        };

        window.switchConv = (id) => {
            fetchConv(id);
        };

        function populateArchive(list) {
            const container = document.getElementById('conv-list');
            container.innerHTML = '';
            list.forEach(c => {
                const btn = document.createElement('button');
                btn.textContent = c.title || c.id.substring(0, 8);
                btn.style.width = '100%';
                btn.style.textAlign = 'left';
                btn.onclick = () => switchConv(c.id);
                container.appendChild(btn);
            });
        }

        // Chat Streaming
        async function sendToFalso(text) {
            appendMessage('user', text);
            changeState('thinking');
            
            const chatArea = document.getElementById('chat-area');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message system';
            chatArea.appendChild(msgDiv);
            
            let fullResponse = "";

            try {
                const res = await fetch(API_BASE + '/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n').filter(l => l.trim() !== '');
                    
                    for (const line of lines) {
                        try {
                            const data = JSON.parse(line);
                            if (data.type === 'tool_start') {
                                const ti = document.getElementById('toolIndicator');
                                if (ti) {
                                    const toolName = escHtml((data.tool || '').replace(/_/g,' ').toUpperCase());
                                    const act = escHtml((data.action || '').toUpperCase());
                                    const detail = escHtml(data.detail || '');
                                    ti.innerHTML = `<span class="spinner">◌</span> ${toolName} — ${act} ${detail ? '// '+detail : ''}`;
                                    ti.classList.add('show');
                                }
                                continue;
                            } else if (data.response) {
                                fullResponse += data.response;
                                msgDiv.innerHTML = fullResponse.replace(/\n/g, '<br>');
                                changeState('speaking');
                                chatArea.scrollTop = chatArea.scrollHeight;
                            } else if (data.done) {
                                const modelName = data.model || '';
                                if (modelName) document.querySelector('.sysid').innerHTML = 'FALSO // ' + escHtml(modelName.toUpperCase().replace(':','')) + '<br>AI CORE ONLINE';
                            } else if (data.error) {
                                fullResponse += 'Error: ' + data.error;
                                msgDiv.innerHTML += `<br><span style="color:#FF6B6B">Error: ${data.error}</span>`;
                                changeState('error');
                            }
                        } catch(e) { console.error("Parse err", e, line); }
                    }
                }
                
                changeState('idle');
                if (fullResponse) {
                    speak(fullResponse);
                }

            } catch (err) {
                console.error(err);
                changeState('error');
            }
        }

        function appendMessage(role, text) {
            const chatArea = document.getElementById('chat-area');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // TTS
        const TTS_MAX_CHARS = 2000; // Truncate long responses for TTS
        async function playServerTTS(text) {
            const ttsText = text.length > TTS_MAX_CHARS ? text.substring(0, TTS_MAX_CHARS) + '...' : text;
            console.log('[TTS] playServerTTS called, text length:', text.length, '→ sending:', ttsText.length, 'chars');
            changeState('speaking');
            try {
                const res = await fetch(API_BASE + '/voice/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: ttsText })
                });

                console.log('[TTS] Server response:', res.status, res.headers.get('content-type'));

                if (res.ok) {
                    const blob = await res.blob();
                    console.log('[TTS] Audio blob received:', blob.size, 'bytes, type:', blob.type);

                    if (blob.size < 100) {
                        console.warn('[TTS] Audio blob too small (<100 bytes), likely empty. Skipping playback.');
                        changeState('idle');
                        return;
                    }

                    const url = URL.createObjectURL(blob);
                    const audio = new Audio(url);
                    audio.onended = () => {
                        console.log('[TTS] Audio playback ended.');
                        URL.revokeObjectURL(url);
                        changeState('idle');
                    };
                    audio.onerror = (e) => {
                        console.error('[TTS] Audio playback error:', e);
                        URL.revokeObjectURL(url);
                        changeState('idle');
                    };
                    try {
                        await audio.play();
                        console.log('[TTS] Audio playback started successfully.');
                    } catch (playErr) {
                        console.warn('[TTS] Autoplay blocked by browser:', playErr.message);
                        // Autoplay was blocked — browser requires user gesture.
                        // Store audio for replay on next user click.
                        window._pendingAudio = audio;
                        window._pendingAudioUrl = url;
                        changeState('idle');
                    }
                } else {
                    const errText = await res.text().catch(() => '');
                    console.error('[TTS] Server error:', res.status, errText);
                    changeState('idle');
                }
            } catch (e) {
                console.error('[TTS] Fetch error:', e);
                changeState('idle');
            }
        }

        function speak(text) {
            if (!text || text.trim().length === 0) return;
            playServerTTS(text);
        }

        // Auto-resume blocked audio on any user click
        document.addEventListener('click', () => {
            if (window._pendingAudio) {
                window._pendingAudio.play().then(() => {
                    console.log('[TTS] Resumed blocked audio on user click.');
                    changeState('speaking');
                    window._pendingAudio = null;
                    URL.revokeObjectURL(window._pendingAudioUrl);
                    window._pendingAudioUrl = null;
                }).catch(() => {});
            }
        }, { once: false });

        // STT Web Speech
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return null;
            
            const rec = new SpeechRecognition();
            rec.continuous = true;
            rec.interimResults = true;
            
            rec.onstart = () => { console.log("STT Start"); changeState('listening'); };
            rec.onresult = (event) => {
                let finalTrans = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTrans += event.results[i][0].transcript;
                    }
                }
                if (finalTrans) {
                    disableMic();
                    sendToFalso(finalTrans);
                }
            };
            rec.onerror = (e) => {
                console.error("STT Error", e.error);
                if (e.error === 'no-speech' && micActive) rec.start();
            };
            rec.onend = () => { if (micActive) rec.start(); };
            
            return rec;
        }

        async function enableMic() {
            if (!speechRec) speechRec = initSpeechRecognition();
            if (speechRec) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    const source = audioContext.createMediaStreamSource(stream);
                    source.connect(analyser);
                    analyser.fftSize = 256;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    
                    micActive = true;
                    document.getElementById('btn-mic').textContent = 'MIC [ON]';
                    document.getElementById('btn-mic').classList.add('active');
                    speechRec.start();
                    pollMic();
                } catch(e) { console.error("Mic access denied", e); }
            }
        }

        function disableMic() {
            micActive = false;
            if (speechRec) speechRec.stop();
            document.getElementById('btn-mic').textContent = 'MIC [OFF]';
            document.getElementById('btn-mic').classList.remove('active');
            changeState('idle');
        }

        function pollMic() {
            if (!micActive || !analyser) return;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let avg = sum / dataArray.length;
            // Can use avg to drive orb pulse, handled in render loop via window.micLevel
            window.micLevel = avg;
            requestAnimationFrame(pollMic);
        }

        document.getElementById('btn-mic').onclick = () => {
            if (micActive) disableMic(); else enableMic();
        };

        // UI & Commands
        document.getElementById('btn-send').onclick = () => {
            const inp = document.getElementById('cmd-input');
            const val = inp.value.trim();
            if (val) {
                runCommand(val);
                inp.value = '';
            }
        };

        document.getElementById('cmd-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('btn-send').click();
        });

        window.togglePanel = (id) => {
            const p = document.getElementById(id);
            if (p.style.display === 'flex') { p.style.display = 'none'; return; }
            p.style.display = 'flex';
            if (id === 'settings-panel' && window.loadSettings) window.loadSettings();
        };

        function runCommand(raw) {
            const cmd = raw.toLowerCase();
            if (cmd === '/archive') togglePanel('archive-panel');
            else if (cmd === '/settings') togglePanel('settings-panel');
            else if (cmd === '/clear') window.newConversation();
            else sendToFalso(raw);
        }

        // Settings
        window.saveSettings = async () => {
            const payload = {
                ai_provider: document.getElementById('set-provider').value,
                gemini_model: document.getElementById('set-model').value,
                tts_provider: document.getElementById('set-tts-provider').value,
                elevenlabs_voice_id: document.getElementById('set-el-voice') ? document.getElementById('set-el-voice').value : '21m00Tcm4TlvDq8ikWAM',
            };
            const keyEl = document.getElementById('set-key');
            if (keyEl && keyEl.value.trim()) payload.gemini_api_key = keyEl.value.trim();
            const elKeyEl = document.getElementById('set-el-key');
            if (elKeyEl && elKeyEl.value.trim()) payload.elevenlabs_api_key = elKeyEl.value.trim();

            try {
                const res = await fetch(API_BASE + '/system/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    const data = await res.json();
                    appendMessage('system', 'Settings saved — ' + (data.tts_provider || 'ELEVENLABS').toUpperCase() + ' TTS active.');
                    if (data.elevenlabs_voice_id) loadVoices(data.elevenlabs_voice_id);
                } else {
                    appendMessage('system', 'Failed to save settings.');
                }
            } catch(e) { appendMessage('system', 'Settings save error: ' + e.message); }
        };

        window.testConnection = async () => {
            appendMessage('system', 'Testing AI connection...');
            try {
                const res = await fetch(API_BASE + '/system/test-connection', { method: 'POST' });
                const data = await res.json();
                appendMessage('system', data.message ? data.message.toUpperCase() : 'Connection OK');
            } catch(e) { appendMessage('system', 'Connection test failed: ' + e.message); }
        };

        window.testVoice = async () => {
            appendMessage('system', 'Generating voice test...');
            try {
                await playServerTTS("Hello, I am FALSO. Voice configuration successful.");
                appendMessage('system', 'Voice test playing.');
            } catch(e) { appendMessage('system', 'Voice test failed: ' + e.message); }
        };

        window.loadVoices = async (selectedVoiceId) => {
            const elVoice = document.getElementById('set-el-voice');
            if (!elVoice) return;
            try {
                const res = await fetch(API_BASE + '/system/voices');
                if (res.ok) {
                    const data = await res.json();
                    if (data.voices && data.voices.length > 0) {
                        elVoice.innerHTML = '';
                        data.voices.forEach(v => {
                            const opt = document.createElement('option');
                            opt.value = v.voice_id;
                            opt.textContent = v.name;
                            elVoice.appendChild(opt);
                        });
                        if (selectedVoiceId) elVoice.value = selectedVoiceId;
                    }
                }
            } catch(e) {}
        };

        // Load settings on panel open
        window.loadSettings = async () => {
            try {
                const res = await fetch(API_BASE + '/system/settings');
                if (res.ok) {
                    const data = await res.json();
                    if (data.ai_provider) document.getElementById('set-provider').value = data.ai_provider;
                    if (data.gemini_model) document.getElementById('set-model').value = data.gemini_model;
                    if (data.tts_provider) document.getElementById('set-tts-provider').value = data.tts_provider;
                    if (data.gemini_api_key_configured) document.getElementById('set-key').placeholder = 'Configured (' + data.gemini_api_key_masked + ')';
                    if (data.elevenlabs_api_key_configured) document.getElementById('set-el-key').placeholder = 'Configured (' + data.elevenlabs_api_key_masked + ')';
                    await loadVoices(data.elevenlabs_voice_id);
                }
                const mRes = await fetch(API_BASE + '/system/models');
                if (mRes.ok) {
                    const mData = await mRes.json();
                    if (mData.models && mData.models.length > 0) {
                        const sel = document.getElementById('set-model');
                        const currentVal = sel.value;
                        sel.innerHTML = '';
                        mData.models.forEach(m => {
                            const opt = document.createElement('option');
                            opt.value = m; opt.textContent = m;
                            sel.appendChild(opt);
                        });
                        if (mData.models.includes(currentVal)) sel.value = currentVal;
                    }
                }
            } catch(e) {}
        };

        // State Machine
        function changeState(newState) {
            sysState = newState;
            document.getElementById('diag-content').innerHTML = `
                SYS.MEM: ${(performance.memory ? (performance.memory.usedJSHeapSize/1048576).toFixed(0) : '???')} MB<br>
                LATENCY: 12 ms<br>
                STATE: ${newState.toUpperCase()}
            `;
            window.orbState = newState; // Communicated to Three.js
        }

        setInterval(() => {
            if(sysState === 'idle') changeState('idle'); // update mem
        }, 2000);


        // ==========================================
        // THREE.JS ULTRON ORB UI PORT
        // ==========================================
        const container = document.getElementById('orb-root');
        
        // Colors
        const C_BRIGHT = 0x00BFFF;
        const C_MID = 0x4DA6FF;
        const C_DIM = 0x1A5C99;
        const C_FAINT = 0x0D3B66;
        const C_HOT = 0x7DF9FF;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 0.5, 5.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.8;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.04;
        controls.maxDistance = 40;
        controls.minDistance = 0.6;
        controls.zoomSpeed = 1.4;
        controls.enablePan = false;

        document.getElementById('btn-reset-cam').onclick = () => {
            camera.position.set(0, 0.5, 5.5);
            controls.target.set(0,0,0);
        };

        // Post Processing
        const renderScene = new RenderPass(scene, camera);
        
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.4, 0.2);
        
        const ChromaticAberrationShader = {
            uniforms: {
                "tDiffuse": { value: null },
                "amount": { value: 0.003 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float amount;
                varying vec2 vUv;
                void main() {
                    vec4 cr = texture2D(tDiffuse, vUv + vec2(amount, 0.0));
                    vec4 cga = texture2D(tDiffuse, vUv);
                    vec4 cb = texture2D(tDiffuse, vUv - vec2(amount, 0.0));
                    gl_FragColor = vec4(cr.r, cga.g, cb.b, cga.a);
                }
            `
        };
        const caPass = new ShaderPass(ChromaticAberrationShader);

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);
        composer.addPass(caPass);

        const orbGroup = new THREE.Group();
        scene.add(orbGroup);

        // Material helpers (match ULTRON's additive blending)
        function lineMat(color, opacity = 1) {
            return new THREE.LineBasicMaterial({
                color, transparent: true, opacity,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
        }
        const matBright = lineMat(C_BRIGHT, 0.8);
        const matMid = lineMat(C_MID, 0.5);
        const matDim = lineMat(C_DIM, 0.3);

        // Helper: Sphere Lines
        function createSphereLines(radius, wSeg, hSeg, material) {
            const geo = new THREE.SphereGeometry(radius, wSeg, hSeg);
            const edges = new THREE.EdgesGeometry(geo);
            return new THREE.LineSegments(edges, material);
        }

        // LAYER 1: Outer shell
        const outerShell = createSphereLines(2.0, 24, 30, matDim);
        orbGroup.add(outerShell);

        // LAYER 2: Grid panels (mock representation)
        const panelMat = new THREE.MeshBasicMaterial({ color: C_DIM, wireframe: true, transparent: true, opacity: 0.2 });
        for(let i=0; i<30; i++) {
            const pGeo = new THREE.PlaneGeometry(0.3, 0.3);
            const pMesh = new THREE.Mesh(pGeo, panelMat);
            const phi = Math.acos( - 1 + ( 2 * i ) / 30 );
            const theta = Math.sqrt( 30 * Math.PI ) * phi;
            pMesh.position.setFromSphericalCoords(2.01, phi, theta);
            pMesh.lookAt(0,0,0);
            orbGroup.add(pMesh);
        }

        // LAYER 3: Secondary shell
        const secShell = createSphereLines(2.12, 12, 16, matMid);
        orbGroup.add(secShell);

        // LAYER 4: Inner core
        const innerCore = createSphereLines(0.9, 16, 16, matBright);
        orbGroup.add(innerCore);

        // LAYER 5: Innermost core (Icosahedron)
        const icoGeo = new THREE.IcosahedronGeometry(0.25, 0);
        const icoEdges = new THREE.EdgesGeometry(icoGeo);
        const innerMost = new THREE.LineSegments(icoEdges, new THREE.LineBasicMaterial({ color: C_HOT }));
        orbGroup.add(innerMost);

        const glowGeo = new THREE.SphereGeometry(0.2, 16, 16);
        const glowMat = new THREE.MeshBasicMaterial({ color: C_HOT, transparent: true, opacity: 0.4 });
        const glowCore = new THREE.Mesh(glowGeo, glowMat);
        orbGroup.add(glowCore);

        // Orbiting Debris
        const debrisGroup = new THREE.Group();
        const dMat = new THREE.MeshBasicMaterial({ color: C_BRIGHT, wireframe: true });
        for(let i=0; i<250; i++) {
            const mesh = new THREE.Mesh(new THREE.TetrahedronGeometry(0.02), dMat);
            const r = 2.5 + Math.random() * 2;
            const th = Math.random() * Math.PI * 2;
            const ph = Math.random() * Math.PI;
            mesh.position.setFromSphericalCoords(r, ph, th);
            mesh.userData = { speed: Math.random() * 0.02, axis: new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize() };
            debrisGroup.add(mesh);
        }
        orbGroup.add(debrisGroup);

        // Text Sprites
        function createTextSprite(text, col) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = col;
            ctx.font = '24px Courier New';
            ctx.fillText(text, 0, 24);
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.7, color: C_BRIGHT });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(0.5, 0.125, 1);
            return sprite;
        }

        const snippets = ["sys.init()", "0xFF3A", "malloc()", "SYS_REQ", "DATA_STREAM"];
        const textGroup = new THREE.Group();
        for(let i=0; i<400; i++) {
            const str = snippets[Math.floor(Math.random() * snippets.length)];
            const sp = createTextSprite(str, "#00BFFF");
            const r = 1.0 + Math.random() * 2.5;
            sp.position.setFromSphericalCoords(r, Math.random()*Math.PI, Math.random()*Math.PI*2);
            textGroup.add(sp);
        }
        orbGroup.add(textGroup);

        // Dust Particles
        const dustGeo = new THREE.BufferGeometry();
        const dPos = [];
        for(let i=0; i<2000; i++) {
            const r = Math.random() * 8;
            const th = Math.random() * Math.PI * 2;
            const ph = Math.random() * Math.PI;
            const p = new THREE.Vector3().setFromSphericalCoords(r, ph, th);
            dPos.push(p.x, p.y, p.z);
        }
        dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dPos, 3));
        const pMat = new THREE.PointsMaterial({ color: C_DIM, size: 0.02, transparent: true, opacity: 0.6 });
        const dust = new THREE.Points(dustGeo, pMat);
        scene.add(dust);

        // Animation logic
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        let clock = new THREE.Clock();
        window.orbState = 'idle';
        window.micLevel = 0;

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const time = clock.getElapsedTime();

            controls.update();

            let pulse = Math.sin(time * 2) * 0.1 + 1;
            
            // State adjustments
            if(window.orbState === 'thinking') {
                orbGroup.rotation.y += 0.02;
                bloomPass.strength = 2.5 + Math.sin(time*10)*0.5;
                caPass.uniforms.amount.value = 0.005;
                glowMat.opacity = 0.8;
            } else if (window.orbState === 'listening') {
                orbGroup.rotation.y += 0.005;
                let m = (window.micLevel / 128.0) * 0.5;
                bloomPass.strength = 1.8 + m;
                innerCore.scale.setScalar(1 + m);
            } else if (window.orbState === 'speaking') {
                orbGroup.rotation.y += 0.01;
                bloomPass.strength = 1.8 + Math.sin(time*5)*0.5;
            } else {
                orbGroup.rotation.y += 0.002;
                bloomPass.strength = 1.8;
                caPass.uniforms.amount.value = 0.002;
                innerCore.scale.setScalar(1);
                glowMat.opacity = 0.4;
            }

            outerShell.rotation.y += 0.001;
            outerShell.rotation.z += 0.0005;
            
            innerCore.rotation.x -= 0.005;
            innerMost.rotation.y += 0.02;
            
            debrisGroup.children.forEach(d => {
                d.position.applyAxisAngle(d.userData.axis, d.userData.speed);
                d.rotation.x += d.userData.speed;
                d.rotation.y += d.userData.speed;
            });

            dust.rotation.y -= 0.001;
            textGroup.rotation.y += 0.0015;

            composer.render();
        }

        // Startup Sequence
        async function runStartup() {
            const log = document.getElementById('startup-log');
            const bar = document.getElementById('startup-progress');
            const steps = ["CORE INIT", "MEMORY LOAD", "NEURAL SYNC", "VOICE LINK", "SYSTEM READY"];
            
            for(let i=0; i<steps.length; i++) {
                log.textContent = steps[i] + "...";
                bar.style.width = ((i+1) * 20) + "%";
                await new Promise(r => setTimeout(r, 600));
            }
            
            const overlay = document.getElementById('startup-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 1000);
            
            animate();
            fetchConvList();
        }

        runStartup();
    </script>
</body>
</html>
